services:
  postgres:
    image: postgres:15-alpine
    container_name: iknowball-postgres
    environment:
      POSTGRES_USER: iknowball
      POSTGRES_PASSWORD: iknowball123
      POSTGRES_DB: iknowball
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iknowball-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iknowball -d iknowball"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iknowball-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iknowball-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prediction-service:
    build:
      context: ../prediction-service
      dockerfile: Dockerfile
    container_name: iknowball-prediction
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://iknowball:iknowball123@postgres:5432/iknowball
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../prediction-service:/app
    networks:
      - iknowball-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: iknowball-backend
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://iknowball:iknowball123@postgres:5432/iknowball
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PREDICTION_SERVICE_URL=http://prediction-service:8001
      - ENABLE_SYNC_QUEUE=true
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prediction-service:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - iknowball-network
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const req = require('http').get('http://localhost:4000/health', (res) => { res.resume(); res.on('end', () => process.exit(res.statusCode === 200 ? 0 : 1)); }); req.on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:

networks:
  iknowball-network:
    driver: bridge
