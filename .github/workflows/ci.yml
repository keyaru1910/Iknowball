name: iKnowBall CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: iknowball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Prisma Generate
        working-directory: ./backend
        run: npx prisma generate --schema=src/module/prisma/schema.prisma

      - name: Backend Build & TypeCheck
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/iknowball_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_must_be_long_enough_12345
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_must_be_long_enough_67890
          EMAIL_VERIFY_SECRET: ci_test_email_verify_secret_13579
        run: npm run test

  frontend-checks:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/my-app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend/my-app
        run: npm ci

      - name: Frontend Build (Next.js)
        working-directory: ./frontend/my-app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  docker-build-checks:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (dry-run)
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: iknowball-backend:ci-test
